[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
worldchain = "${WORLDCHAIN_RPC_URL}"
worldchain_sepolia = "${WORLDCHAIN_SEPOLIA_RPC_URL}"

[etherscan]
worldchain = { key = "${WORLDSCAN_API_KEY}", url = "https://api.worldscan.org/api", chain = 480 }
